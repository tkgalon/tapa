included:
  - Package.swift
  - Sources
  - Tests

opt_in_rules:
  - closure_spacing
  - empty_count
  - explicit_init
  - first_where
  - sorted_imports
  - toggle_bool

trailing_comma:
  mandatory_comma: true

# A switch that maps each case of an enum to a value isn't branching logic.
cyclomatic_complexity:
  ignores_case_statements: true

line_length:
  warning: 120
  error: 160

identifier_name:
  excluded:
    - at
    - id

# Test fixtures use short builders such as date(26, 9).
function_parameter_count:
  warning: 6
